# format = "[󰍛](white) [$output](#be9ddf) "

# --------------------------------------------------
# TIME
# --------------------------------------------------

[time]
disabled = false
time_format = "%A, %-I:%M:%S %p"
format = "[󰃰](white) [$time](#7eb8da) "

# --------------------------------------------------
# GIT BRANCH
# --------------------------------------------------

[git_branch]
symbol = ""
format = " [](white) [$branch](#ffa5d8)"

# --------------------------------------------------
# GIT STATUS
# --------------------------------------------------

[git_status]
style = "#ffa5d8"
format = "[$all_status$ahead_behind]($style)"

conflicted = " = $count"
ahead = " ⇡$count"
behind = " ⇣$count"
diverged = " ⇕⇡$ahead_count⇣$behind_count"
up_to_date = ""

untracked = " [󰝒](white) $count"
stashed = " [󰆓](white) $count"
modified = " [](white) $count"
staged = " [](white) $count"
renamed = " [󰑕](white) $count"
deleted = " [󰧧](white) $count"

# --------------------------------------------------
# AWS
# --------------------------------------------------

[aws]
format = " [$profile( @$region)](#ffa5d8)"

# --------------------------------------------------
# KUBERNETES
# --------------------------------------------------

[kubernetes]
disabled = false
format = " [$context( :: $namespace)](#ffa5d8)"

# --------------------------------------------------
# EXIT STATUS
# --------------------------------------------------

[status]
disabled = false
symbol = ""
success_symbol = ""
format = " [󰞏](white) [Error - check your command](#ffa5ab)"

# --------------------------------------------------
# DIRECTORY
# --------------------------------------------------

[directory]
truncation_length = 0
truncate_to_repo = false
format = "[](#7eb8da) [](#7E96DA) [$path](#98bfad)"

# --------------------------------------------------
# PROMPT CHARACTER
# --------------------------------------------------

[character]
success_symbol = "[  󰯂](#7E96DA)"
error_symbol = "[  󰯂](#7E96DA)"
vimcmd_symbol = "[  󰯂](#be9ddf)"