add_newline = false
command_timeout = 1000

format = """
$username[@](#7eb8da)$hostname$cmd_duration${custom.memory}$time$git_branch$git_status$aws$kubernetes$status
$directory
$character"""

# --------------------------------------------------
# USERNAME
# --------------------------------------------------

[username]
show_always = true
style_user = "#7eb8da"
style_root = "#7eb8da"
format = "[](#7eb8da) [󰀉](white) [$user]($style) "

# --------------------------------------------------
# HOSTNAME
# --------------------------------------------------

[hostname]
ssh_only = false
style = "#7eb8da"
format = " [󰟀](white) [$hostname]($style) "

# --------------------------------------------------
# EXECUTION TIME
# --------------------------------------------------

[cmd_duration]
min_time = 0
show_milliseconds = false
format = "[](white) [$duration](#be9ddf) "

# --------------------------------------------------
# MEMORY
# --------------------------------------------------

